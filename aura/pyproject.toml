[project]
name = "aura"
version = "0.1.0"
description = "AWS Optimizer Orchestrator - Job scheduling and execution system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
    "aura",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
]

[project.scripts]
aura = "aura.__main__:main"
    
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aura"]
