docker:
  optimizer_image: "awsome-savings:optimizer"
  families_mount: "/optimizer-files"
  proto_mount: "/optimizer-proto"
  logs_mount: "/optimizer-logs"
  verbose_docker: false
  dry_run: false

scheduler:
  default_max_build: 2
  default_max_solve: 1
  default_poll_interval: 0.2
  job_timeout: 3600

storage:
  runs_dir: "./orchestrator_runs"
  max_old_runs: 100
  cleanup_model_after_solve: true

monitoring:
  log_dir: "./monitor_logs"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
