version: '3.8'

services:
  python-tests:
    build:
      context: .
      dockerfile: Dockerfile.python-test
    volumes:
      - ./tests:/app/tests
      - ./implementations/py:/app/implementations/py
      - ./implementations/py_sp_only:/app/implementations/py_sp_only
    environment:
      - PYTHONPATH=/app
    command: [".venv/bin/python", "-m", "unittest", "discover", "-s", "tests", "-p", "test_py*.py", "-v"]

  cpp-tests:
    build:
      context: .
      dockerfile: Dockerfile.cpp-test
    volumes:
      - ./tests:/app/tests
      - ./implementations/cpp_sp_only:/app/implementations/cpp_sp_only
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib
    command: ["python", "-m", "unittest", "tests.test_cpp_sp_only", "-v"]

  all-tests:
    build:
      context: .
      dockerfile: Dockerfile.cpp-test
    volumes:
      - ./tests:/app/tests
      - ./implementations:/app/implementations
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib
      - PYTHONPATH=/app
    command: >
      /bin/bash -c "
        echo 'Running Python tests...' &&
        python -m unittest discover -s tests -p 'test_py*.py' -v &&
        echo 'Running C++ tests...' &&
        python -m unittest tests.test_cpp_sp_only -v &&
        echo 'All tests completed successfully!'
      "
